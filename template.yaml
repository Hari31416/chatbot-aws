AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Chatbot API deployed on AWS Lambda, DynamoDB, S3, and SSM.

Parameters:
  Environment:
    Type: String
    Default: prod
    Description: Deployment environment (dev, staging, prod)
  LiteLlmModel:
    Type: String
    Default: openai/gpt-oss-120b
    Description: Model to use for chat generation via LiteLLM
  LiteLlmVisionModel:
    Type: String
    Default: gemini/gemini-3.1-flash-lite
    Description: Vision model to use for chat generation via LiteLLM
  LiteLlmEmbeddingModel:
    Type: String
    Default: gemini/gemini-embedding-2
    Description: Embedding model to use for RAG via LiteLLM
  S3VectorBucketName:
    Type: String
    Default: chatbot-vectors-prod
    Description: S3 Vectors bucket name for RAG embeddings
  S3VectorIndexName:
    Type: String
    Default: enterprise-kb
    Description: S3 Vectors index name for RAG embeddings
  ContextTtlSeconds:
    Type: Number
    Default: 3600
    Description: Conversation context TTL in seconds
  LiteLlmBaseUrl:
    Type: String
    Default: https://integrate.api.nvidia.com/v1
    Description: Base URL for LiteLLM API
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: Python logging level for the Lambda function
  ClerkIssuer:
    Type: String
    Default: "https://accurate-moccasin-43.clerk.accounts.dev/"
    Description: Clerk OIDC Issuer URL
  ClerkJwksUrl:
    Type: String
    Default: ""
    Description: Clerk JWKS URL (optional)
  ClerkAuthorizedParties:
    Type: String
    Default: ""
    Description: Clerk Authorized Parties (optional, comma-separated allowed origins)
  RagTopK:
    Type: Number
    Default: 3
    Description: Number of retrieved chunks for RAG context

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:

      Variables:
        DYNAMODB_TABLE_NAME: !Ref ChatbotTable
        S3_BUCKET_NAME: !Sub "chatbot-uploads-${AWS::AccountId}-${Environment}"
        LITELLM_MODEL: !Ref LiteLlmModel
        LITELLM_BASE_URL: !Ref LiteLlmBaseUrl
        LITELLM_VISION_MODEL: !Ref LiteLlmVisionModel
        LITELLM_EMBEDDING_MODEL: !Ref LiteLlmEmbeddingModel
        LITELLM_VISION_API_KEY_PARAMETER: /chatbot/litellm_vision_api_key
        LITELLM_EMBEDDING_API_KEY_PARAMETER: /chatbot/litellm_embedding_api_key
        S3_VECTOR_BUCKET_NAME: !Ref S3VectorBucketName
        S3_VECTOR_INDEX_NAME: !Ref S3VectorIndexName
        EMBEDDING_DIMENSION: 768
        RAG_TOP_K: !Ref RagTopK
        RAG_CHUNK_SIZE: 800
        RAG_CHUNK_OVERLAP: 80
        CONTEXT_TTL_SECONDS: !Ref ContextTtlSeconds
        MAX_HISTORY_MESSAGES: 10
        LITELLM_API_KEY_PARAMETER: /chatbot/litellm_api_key
        LOG_LEVEL: !Ref LogLevel
        CLERK_ISSUER: !Ref ClerkIssuer
        CLERK_JWKS_URL: !Ref ClerkJwksUrl
        CLERK_AUTHORIZED_PARTIES: !Ref ClerkAuthorizedParties

Resources:
  # -------------------------------------------------------------
  # Lambda Function
  # -------------------------------------------------------------
  ChatbotBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./backend
      Handler: run.sh
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:27
      Policies:
        # Grants Read/Write access to the DynamoDB Table
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatbotTable
        # Grants Read/Write access to the S3 Bucket
        - S3CrudPolicy:
            BucketName: !Ref ChatbotStorageBucket
        # Grants read access to SSM SecureString parameter for LLM Keys
        - SSMParameterReadPolicy:
            ParameterName: chatbot/litellm_api_key
        - SSMParameterReadPolicy:
            ParameterName: chatbot/litellm_vision_api_key
        - SSMParameterReadPolicy:
            ParameterName: chatbot/litellm_embedding_api_key
        - Statement:
            - Effect: Allow
              Action:
                - s3vectors:PutVectors
                - s3vectors:QueryVectors
                - s3vectors:GetVectors
                - s3vectors:ListIndexes
                - s3vectors:DeleteVectors
              Resource: !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${S3VectorBucketName}/*"
            - Effect: Allow
              Action:
                - s3vectors:ListVectorBuckets
              Resource: "*" # Required — no resource-level support for bucket listing
            - Effect: Allow
              Action:
                - textract:DetectDocumentText
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: "*" # Textract does not support resource-level ARNs
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_PASS_THROUGH_PATH: "/warm"
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

      Events:
        # Secured proxy routes (inherits DefaultAuthorizer from ChatbotHttpApi)
        GetApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: GET
            ApiId: !Ref ChatbotHttpApi
        PostApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: POST
            ApiId: !Ref ChatbotHttpApi
        PutApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: PUT
            ApiId: !Ref ChatbotHttpApi
        DeleteApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: DELETE
            ApiId: !Ref ChatbotHttpApi
        # Public health check endpoint
        HealthEvent:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
            ApiId: !Ref ChatbotHttpApi
        # EventBridge Warmup Schedule (Runs every 5 minutes)
        WarmingScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: "rate(5 minutes)"
            Description: "Pings the API warm endpoint every 5 minutes to keep the container warm"
            Enabled: true
            Input: '{"version": "2.0", "rawPath": "/warm", "headers": {}, "requestContext": {"http": {"method": "GET", "path": "/warm"}}}'


  ChatbotBackendFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatbotBackendFunction}
      RetentionInDays: 7

  # -------------------------------------------------------------
  # API Gateway HTTP API (API v2)
  # -------------------------------------------------------------
  ChatbotHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS




  # -------------------------------------------------------------
  # DynamoDB Single Table
  # -------------------------------------------------------------
  ChatbotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub chatbot-table-${Environment}
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserConversationsIndexV2
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - conversation_id
              - name
              - created_at
              - updated_at
          ProvisionedThroughput:
            ReadCapacityUnits: 2
            WriteCapacityUnits: 2
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -------------------------------------------------------------
  # Amazon S3 Bucket for Uploads
  # -------------------------------------------------------------
  ChatbotStorageBucket:
    Type: AWS::S3::Bucket
    # NotificationConfiguration references !GetAtt ChatbotIngestionInitializerFunction.Arn,
    # so CloudFormation implicitly creates the function before the bucket.
    # The function has NO reference back to this bucket (S3CrudPolicy uses !Sub literal),
    # so there is NO circular dependency.
    Properties:
      BucketName: !Sub chatbot-uploads-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Auto-expire uploaded files after 7 days to conserve free tier storage
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTemporaryUploads
            Status: Enabled
            ExpirationInDays: 7
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: staging/
            Function: !GetAtt ChatbotIngestionInitializerFunction.Arn

  # -------------------------------------------------------------
  # Amazon S3 Bucket for Static Frontend Website Hosting (Public S3 Website)
  # -------------------------------------------------------------
  ChatbotFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub chatbot-frontend-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # -------------------------------------------------------------
  # S3 Bucket Policy allowing Public Read access for website files
  # -------------------------------------------------------------
  ChatbotFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ChatbotFrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ChatbotFrontendBucket}/*

  # -------------------------------------------------------------
  # Amazon S3 Vectors Vector Bucket
  # -------------------------------------------------------------
  ChatbotVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Ref S3VectorBucketName
      EncryptionConfiguration:
        SseType: "AES256"

  # -------------------------------------------------------------
  # Amazon S3 Vectors Index
  # -------------------------------------------------------------
  ChatbotVectorIndex:
    Type: AWS::S3Vectors::Index
    DependsOn: ChatbotVectorBucket
    Properties:
      IndexName: !Ref S3VectorIndexName
      VectorBucketName: !Ref S3VectorBucketName
      DataType: "float32"
      Dimension: 768
      DistanceMetric: "cosine"
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - "text"

  # -------------------------------------------------------------
  # SNS Topic — Textract publishes completion notifications here
  # -------------------------------------------------------------
  TextractCompletionTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub chatbot-textract-completion-${Environment}

  # -------------------------------------------------------------
  # IAM Role — allows Textract to publish to TextractCompletionTopic
  # -------------------------------------------------------------
  TextractSNSRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub chatbot-textract-sns-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: textract.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TextractPublishToSNS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref TextractCompletionTopic

  # -------------------------------------------------------------
  # SQS Dead-Letter Queue for Processor
  # -------------------------------------------------------------
  ProcessorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub chatbot-processor-dlq-${Environment}
      MessageRetentionPeriod: 1209600 # 14 days

  # -------------------------------------------------------------
  # SQS Queue — receives Textract SNS notifications + direct text msgs
  # -------------------------------------------------------------
  ProcessorQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub chatbot-processor-queue-${Environment}
      VisibilityTimeout: 180 # Must be >= Processor Lambda timeout (120s)
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProcessorDLQ.Arn
        maxReceiveCount: 3

  ProcessorQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProcessorQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSNSToSendMessage
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ProcessorQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref TextractCompletionTopic

  TextractTopicProcessorQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref TextractCompletionTopic
      Protocol: sqs
      Endpoint: !GetAtt ProcessorQueue.Arn
      RawMessageDelivery: false # keep SNS envelope so processor can detect source

  # -------------------------------------------------------------
  # Lambda 1 — Ingestion Initializer (triggered directly by S3)
  # -------------------------------------------------------------
  ChatbotIngestionInitializerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./backend
      Handler: app.worker_initializer.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          PROCESSOR_QUEUE_URL: !Ref ProcessorQueue
          TEXTRACT_SNS_ROLE_ARN: !GetAtt TextractSNSRole.Arn
          TEXTRACT_SNS_TOPIC_ARN: !Ref TextractCompletionTopic
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub chatbot-uploads-${AWS::AccountId}-${Environment}
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatbotTable
        - SSMParameterReadPolicy:
            ParameterName: chatbot/litellm_embedding_api_key
        - Statement:
            - Effect: Allow
              Action:
                - textract:StartDocumentTextDetection
              Resource: "*" # Textract does not support resource-level ARNs
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt TextractSNSRole.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt ProcessorQueue.Arn
      # No Events block here — S3 notification is configured manually on ChatbotStorageBucket
      # to avoid the SAM Type:S3 circular dependency (bucket ↔ function).

  # Lambda permission allowing S3 to invoke the Initializer.
  # SourceArn uses !Sub literal — does NOT reference !Ref ChatbotStorageBucket,
  # which is what breaks the cycle.
  ChatbotIngestionInitializerFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ChatbotIngestionInitializerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::chatbot-uploads-${AWS::AccountId}-${Environment}"

  ChatbotIngestionInitializerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatbotIngestionInitializerFunction}
      RetentionInDays: 7

  # -------------------------------------------------------------
  # Lambda 2 — Ingestion Processor (triggered by ProcessorQueue)
  # -------------------------------------------------------------
  ChatbotIngestionProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./backend
      Handler: app.worker_processor.handler
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          PROCESSOR_QUEUE_URL: !Ref ProcessorQueue
          TEXTRACT_SNS_ROLE_ARN: !GetAtt TextractSNSRole.Arn
          TEXTRACT_SNS_TOPIC_ARN: !Ref TextractCompletionTopic
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt ProcessorQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Sub chatbot-uploads-${AWS::AccountId}-${Environment}
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatbotTable
        - SSMParameterReadPolicy:
            ParameterName: chatbot/litellm_embedding_api_key
        - Statement:
            - Effect: Allow
              Action:
                - s3vectors:PutVectors
                - s3vectors:QueryVectors
                - s3vectors:GetVectors
                - s3vectors:ListIndexes
                - s3vectors:DeleteVectors
              Resource: !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${S3VectorBucketName}/*"
            - Effect: Allow
              Action:
                - s3vectors:ListVectorBuckets
              Resource: "*"
            - Effect: Allow
              Action:
                - textract:GetDocumentTextDetection
              Resource: "*"
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessorQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 2

  ChatbotIngestionProcessorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatbotIngestionProcessorFunction}
      RetentionInDays: 7

  TableReadCapacityScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 8
      MinCapacity: 2
      ResourceId: !Sub table/${ChatbotTable}
      ScalableDimension: dynamodb:table:ReadCapacityUnits
      ServiceNamespace: dynamodb

  TableReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: TableReadAutoScalingPolicy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref TableReadCapacityScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70.0
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization

  TableWriteCapacityScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 8
      MinCapacity: 2
      ResourceId: !Sub table/${ChatbotTable}
      ScalableDimension: dynamodb:table:WriteCapacityUnits
      ServiceNamespace: dynamodb

  TableWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: TableWriteAutoScalingPolicy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref TableWriteCapacityScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70.0
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization

  GSIReadCapacityScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 8
      MinCapacity: 2
      ResourceId: !Sub table/${ChatbotTable}/index/UserConversationsIndexV2
      ScalableDimension: dynamodb:index:ReadCapacityUnits
      ServiceNamespace: dynamodb

  GSIReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: GSIReadAutoScalingPolicy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref GSIReadCapacityScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70.0
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization

  GSIWriteCapacityScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 8
      MinCapacity: 2
      ResourceId: !Sub table/${ChatbotTable}/index/UserConversationsIndexV2
      ScalableDimension: dynamodb:index:WriteCapacityUnits
      ServiceNamespace: dynamodb

  GSIWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: GSIWriteAutoScalingPolicy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref GSIWriteCapacityScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70.0
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization

Outputs:
  ApiUrl:
    Description: "FastAPI base deployment URL"
    Value: !Sub "https://${ChatbotHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionUrl:
    Description: "FastAPI Lambda Function URL for response streaming"
    Value: !GetAtt ChatbotBackendFunctionUrl.FunctionUrl
  FrontendUrl:
    Description: "S3 Static Website Hosting URL for the Chatbot React Frontend"
    Value: !GetAtt ChatbotFrontendBucket.WebsiteURL
  FrontendBucket:
    Description: "S3 Bucket Name for the Frontend Website"
    Value: !Ref ChatbotFrontendBucket
