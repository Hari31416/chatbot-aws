AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Chatbot API deployed on AWS Lambda, DynamoDB, S3, and SSM.

Parameters:
  Environment:
    Type: String
    Default: prod
    Description: Deployment environment (dev, staging, prod)
  LiteLlmModel:
    Type: String
    Default: openai/gpt-oss-120b
    Description: Model to use for chat generation via LiteLLM
  ContextTtlSeconds:
    Type: Number
    Default: 3600
    Description: Conversation context TTL in seconds
  LiteLlmBaseUrl:
    Type: String
    Default: https://integrate.api.nvidia.com/v1
    Description: Base URL for LiteLLM API
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: Python logging level for the Lambda function

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:

      Variables:
        DYNAMODB_TABLE_NAME: !Ref ChatbotTable
        S3_BUCKET_NAME: !Ref ChatbotStorageBucket
        LITELLM_MODEL: !Ref LiteLlmModel
        LITELLM_BASE_URL: !Ref LiteLlmBaseUrl
        CONTEXT_TTL_SECONDS: !Ref ContextTtlSeconds
        MAX_HISTORY_MESSAGES: 10
        LITELLM_API_KEY_PARAMETER: /chatbot/litellm_api_key
        LOG_LEVEL: !Ref LogLevel

Resources:
  # -------------------------------------------------------------
  # Lambda Function
  # -------------------------------------------------------------
  ChatbotBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./backend
      Handler: app.main.handler
      Policies:
        # Grants Read/Write access to the DynamoDB Table
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatbotTable
        # Grants Read/Write access to the S3 Bucket
        - S3CrudPolicy:
            BucketName: !Ref ChatbotStorageBucket
        # Grants read access to SSM SecureString parameter for LLM Keys
        - SSMParameterReadPolicy:
            ParameterName: chatbot/litellm_api_key
      Events:
        # Proxy routes all traffic (ANY) to the FastAPI Mangum handler
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref ChatbotHttpApi

  # -------------------------------------------------------------
  # API Gateway HTTP API (API v2)
  # -------------------------------------------------------------
  ChatbotHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS


  # -------------------------------------------------------------
  # DynamoDB Single Table
  # -------------------------------------------------------------
  ChatbotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub chatbot-table-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -------------------------------------------------------------
  # Amazon S3 Bucket for Uploads
  # -------------------------------------------------------------
  ChatbotStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub chatbot-uploads-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Auto-expire uploaded files after 7 days to conserve free tier storage
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTemporaryUploads
            Status: Enabled
            ExpirationInDays: 7

  # -------------------------------------------------------------
  # Amazon S3 Bucket for Static Frontend Website Hosting
  # -------------------------------------------------------------
  ChatbotFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub chatbot-frontend-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # -------------------------------------------------------------
  # CloudFront Origin Access Control (OAC) for S3 Security
  # -------------------------------------------------------------
  ChatbotFrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: OAC for Chatbot React Frontend S3 Bucket
        Name: !Sub chatbot-frontend-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # -------------------------------------------------------------
  # S3 Bucket Policy allowing CloudFront Read access
  # -------------------------------------------------------------
  ChatbotFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ChatbotFrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ChatbotFrontendBucket}/*
            Condition:
              ArnEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ChatbotFrontendDistribution}

  # -------------------------------------------------------------
  # CloudFront CDN Distribution
  # -------------------------------------------------------------
  ChatbotFrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: S3-ChatbotFrontend
            DomainName: !GetAtt ChatbotFrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt ChatbotFrontendOAC.Id
        Enabled: true
        DefaultRootObject: index.html
        # Client side SPA routing safe error overrides
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        DefaultCacheBehavior:
          TargetOriginId: S3-ChatbotFrontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

Outputs:
  ApiUrl:
    Description: "FastAPI base deployment URL"
    Value: !Sub "https://${ChatbotHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendUrl:
    Description: "CloudFront Distribution URL for the Chatbot React Frontend"
    Value: !Sub "https://${ChatbotFrontendDistribution.DomainName}"

